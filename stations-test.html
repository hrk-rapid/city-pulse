<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>TX Station Test</title>
        <style>
            body{
                margin: 0;
                background: #050505;
            }
            canvas{
                display: block;
                background: #050505;
            }
        </style>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    </head>
    <body>
        <canvas id="mainCanvas"></canvas>

        <script>
            const canvas = document.getElementById("mainCanvas");
            const ctx = canvas.getContext("2d");

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const synth = new Tone.Synth().toDestination();
            let audioReady = false;

            document.addEventListener("click", async () => {
                if (!audioReady) {
                    await Tone.start();
                    audioReady = true;
                    console.log("音声再生の準備可能");
                }
            }); 

            const drawStations = async() =>{
                const response = await fetch("./stations.json");
                const data = await response.json();

                const stations = data.filter(station =>
                    typeof station["geo:lat"] === "number" &&
                    typeof station["geo:long"] === "number"
                )
                .sort((a, b) => a["geo:long"] - b["geo:long"]);

                const latitudes = stations.map(station => station["geo:lat"]);
                const longitudes = stations.map(station => station["geo:long"]);

                const minLatitude = Math.min(...latitudes);
                const maxLatitude = Math.max(...latitudes);
                const minLongitude = Math.min(...longitudes);
                const maxLongitude = Math.max(...longitudes);

                const toCanvasPosition = (station) =>{
                    const latitude = station["geo:lat"];
                    const longitude = station["geo:long"];

                    const x = 40 + (longitude - minLongitude) / (maxLongitude - minLongitude) * (canvas.width - 80);
                    const y = 40 + (maxLatitude - latitude) / (maxLatitude - minLatitude) * (canvas.height - 80);

                    return {x, y};
                }
                

                const trainStations = stations.map((station) => {
                    const {x, y} = toCanvasPosition(station);
                    return{
                        name: station["dc:title"],
                        x: x,
                        y: y};
                });

                
                const notes = ["C4", "D4", "E4", "G4", "A4", "C5"];


                console.log(trainStations);

                const train = {
                    x: trainStations[0].x,
                    y: trainStations[0].y,
                    targetIndex: 1,
                    speed: 0.5,
                    direction: 1
                };

              

                const drawTrain = () =>{
                    ctx.save();

                    ctx.fillStyle = "#f43f5e";
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = "#f43f5e";

                    ctx.beginPath();
                    ctx.arc(train.x, train.y, 5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                };

               

                const moveTrain = () =>{
                    const target = trainStations[train.targetIndex];
                    //目的地までの距離
                    const dx = target.x - train.x;
                    const dy = target.y - train.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if(distance > train.speed){
                        train.x += (dx / distance) * train.speed;
                        train.y += (dy / distance) * train.speed;
                    }else{
                        train.x = target.x;
                        train.y = target.y;

                        if(audioReady){
                            const note = notes[train.targetIndex % notes.length];
                            synth.triggerAttackRelease(note, "8n");
                        }

                        if (train.targetIndex === trainStations.length - 1) {
                            train.direction = -1;
                        } else if (train.targetIndex === 0) {
                            train.direction = 1;
                        }

                        train.targetIndex += train.direction;
                    };

                }

                const drawRoute = () =>{
                    //路線の描画
                    ctx.strokeStyle = "#38bdf8";
                    ctx.lineWidth = 2;
                    ctx.beginPath();

                    stations.forEach((station, index) => {
                        const {x, y} = toCanvasPosition(station);
                        if(index === 0){
                            ctx.moveTo(x, y);
                        }else{
                            ctx.lineTo(x, y);
                        }
                    });
                    ctx.stroke();
                    //駅を丸で描画して駅名の表示
                    stations.forEach(station => {
                    const {x, y} = toCanvasPosition(station);

                    ctx.fillStyle = "#38bdf8";
                    ctx.beginPath();
                    ctx.arc(x, y, 5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = "white";
                    ctx.font = "12px sans-serif";
                    ctx.fillText(station["dc:title"], x+6, y+8);
                });

                };

                const animate = () => {
                    ctx.fillStyle = "rgba(5, 5, 5, 0.2)";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                   
                    drawRoute();
                    moveTrain();
                    drawTrain();
                    requestAnimationFrame(animate);
                };

                animate();
            };

            drawStations();
            

        </script>
    </body>
</html>
